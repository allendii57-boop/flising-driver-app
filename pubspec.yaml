name: flising_driver
description: Premium ride hailing platform for drivers.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.9.0
  geolocator: any
  http: any
  firebase_core: any
  firebase_auth: any
  firebase_database: any
  firebase_storage: any
  firebase_analytics: ^12.3.0
  firebase_messaging: ^16.2.0
  image_picker: any
  url_launcher: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/flising_logo.png
